<!DOCTYPE html>
<html>

<head>

<title>Edit Fees</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-warning">

<h3>✏️ Edit Fee Record</h3>

</div>

<div class="card-body">

<form
action="/update_fee/{{ fee.fee_id }}"
method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label>Student ID</label>

<input
type="number"
name="student_id"
class="form-control"
value="{{ fee.student_id }}"
required>

</div>

<div class="col-md-6 mb-3">

<label>Payment Date</label>

<input
type="date"
name="payment_date"
class="form-control"
value="{{ fee.payment_date }}"
required>

</div>

<div class="col-md-6 mb-3">

<label>Total Fees</label>

<input
type="number"
name="total_fees"
class="form-control"
value="{{ fee.total_fees }}"
required>

</div>

<div class="col-md-6 mb-3">

<label>Paid Amount</label>

<input
type="number"
name="paid_amount"
class="form-control"
value="{{ fee.paid_amount }}"
required>

</div>

<div class="col-md-6 mb-3">

<label>Balance</label>

<input
type="number"
name="balance"
class="form-control"
value="{{ fee.balance }}"
required>

</div>

<div class="col-md-6 mb-3">

<label>Payment Mode</label>

<select
name="payment_mode"
class="form-select">

<option
{% if fee.payment_mode == "Cash" %}selected{% endif %}>
Cash
</option>

<option
{% if fee.payment_mode == "UPI" %}selected{% endif %}>
UPI
</option>

<option
{% if fee.payment_mode == "Card" %}selected{% endif %}>
Card
</option>

<option
{% if fee.payment_mode == "Bank Transfer" %}selected{% endif %}>
Bank Transfer
</option>

</select>

</div>

<div class="col-md-12 mb-3">

<label>Remarks</label>

<input
type="text"
name="remarks"
class="form-control"
value="{{ fee.remarks or '' }}">

</div>

</div>

<button
type="submit"
class="btn btn-success">

Update Fee

</button>

<a
href="/fees"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

</body>

</html>

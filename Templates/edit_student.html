<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-warning">
<h3>Edit Student</h3>
</div>

<div class="card-body">

<form action="/update_student/{{ student.student_id }}" method="POST">

<div class="row">

<div class="col-md-6 mb-3">
<label>Student Name</label>
<input type="text" name="student_name" class="form-control"
value="{{ student.student_name }}" required>
</div>

<div class="col-md-6 mb-3">
<label>Mobile</label>
<input type="text" name="mobile" class="form-control"
value="{{ student.mobile }}">
</div>

<div class="col-md-6 mb-3">
<label>Email</label>
<input type="email" name="email" class="form-control"
value="{{ student.email }}">
</div>

<div class="col-md-6 mb-3">
<label>Course</label>
<input type="text" name="course" class="form-control"
value="{{ student.course }}">
</div>

<div class="col-md-6 mb-3">
<label>Batch</label>
<input type="text" name="batch" class="form-control"
value="{{ student.batch }}">
</div>

<div class="col-md-6 mb-3">
<label>Joining Date</label>
<input type="date" name="joining_date"
value="{{ student.joining_date }}"
class="form-control">
</div>

<div class="col-md-6 mb-3">
<label>Fees</label>
<input type="number" name="fees"
value="{{ student.fees }}"
class="form-control">
</div>

<div class="col-md-6 mb-3">

<label>Status</label>

<select name="status" class="form-select">

<option value="Active"
{% if student.status=="Active" %}selected{% endif %}>
Active
</option>

<option value="Inactive"
{% if student.status=="Inactive" %}selected{% endif %}>
Inactive
</option>

</select>

</div>

</div>

<button class="btn btn-success">
Update Student
</button>

<a href="/students" class="btn btn-secondary">
Back
</a>

</form>

</div>

</div>

</div>

</body>
</html>

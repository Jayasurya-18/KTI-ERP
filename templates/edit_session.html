<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Edit Session</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>


<body class="bg-light">


<div class="container mt-5">


<div class="card shadow">


<div class="card-header bg-warning">

<h3>✏️ Edit Session</h3>

</div>


<div class="card-body">


<form
action="/update_session/{{ session.session_id }}"
method="POST">


<div class="row">


<!-- Session Name -->

<div class="col-md-6 mb-3">

<label class="form-label">
Session Name
</label>

<input
type="text"
name="session_name"
class="form-control"
value="{{ session.session_name }}"
required>

</div>


<!-- Faculty -->

<div class="col-md-6 mb-3">

<label class="form-label">
Faculty
</label>

<input
type="text"
name="faculty"
class="form-control"
value="{{ session.faculty }}"
required>

</div>


<!-- Session Date -->

<div class="col-md-4 mb-3">

<label class="form-label">
Session Date
</label>

<input
type="date"
name="session_date"
class="form-control"
value="{{ session.session_date }}"
required>

</div>


<!-- Start Time -->

<div class="col-md-4 mb-3">

<label class="form-label">
Start Time
</label>

<input
type="time"
name="start_time"
class="form-control"
value="{{ session.start_time }}"
required>

</div>


<!-- End Time -->

<div class="col-md-4 mb-3">

<label class="form-label">
End Time
</label>

<input
type="time"
name="end_time"
class="form-control"
value="{{ session.end_time }}"
required>

</div>


<!-- Topic -->

<div class="col-md-6 mb-3">

<label class="form-label">
Topic
</label>

<input
type="text"
name="topic"
class="form-control"
value="{{ session.topic or '' }}">

</div>


<!-- Remarks -->

<div class="col-md-6 mb-3">

<label class="form-label">
Remarks
</label>

<input
type="text"
name="remarks"
class="form-control"
value="{{ session.remarks or '' }}">

</div>


</div>


<button
type="submit"
class="btn btn-success">

💾 Update Session

</button>


<a
href="/sessions"
class="btn btn-secondary">

Cancel

</a>


</form>


</div>


</div>


</div>


</body>

</html>
